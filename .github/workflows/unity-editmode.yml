# Loombridge Unity EditMode tests (GameCI).
#
# The has-license gating lets forks (and this repo, until UNITY_LICENSE is
# configured) skip gracefully instead of failing.
name: Unity EditMode Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - "unity-dev-project/**"
      - ".github/workflows/unity-editmode.yml"
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "unity-dev-project/**"
      - ".github/workflows/unity-editmode.yml"

jobs:
  detect-tests:
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.detect.outputs.has_tests }}
      has_license: ${{ steps.license.outputs.has_license }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Unity test files
        id: detect
        run: |
          if [ -d packages/com.loomtide.loombridge/Tests/Editor ] && find packages/com.loomtide.loombridge/Tests/Editor -type f \( -name '*Test.cs' -o -name '*Tests.cs' \) | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      # The `secrets` context is NOT available in job-level `if:` — referencing it
      # there is a workflow-file validation error (every run fails at 0s with no
      # jobs). Check the secret in a STEP and export the answer as a job output.
      - name: Detect Unity license secret
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
          fi

  run-editmode-tests:
    needs: detect-tests
    if: ${{ needs.detect-tests.outputs.has_tests == 'true' && needs.detect-tests.outputs.has_license == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - unity_version: 6000.3.9f1
            label: "6000.3-primary"
          - unity_version: 2022.3.0f1
            label: "2022.3-compat"
    runs-on: ubuntu-latest
    name: Unity EditMode (${{ matrix.label }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity-dev-project
          unityVersion: ${{ matrix.unity_version }}
          testMode: EditMode
          artifactsPath: unity-test-results/${{ matrix.label }}

      # G10. The GameCI action reports its own pass/fail, but nothing in this workflow ever
      # read the NUnit3 XML with the SAME mapping `loombridge` uses, so the CLI's verdict and
      # CI's could diverge silently. These three steps close that: the grade step runs the
      # real `tests grade` over whatever XML landed, so a shape the CLI refuses (a skipped
      # fixture, a cancelled run, zero cases) fails the job here too.
      #
      # `if: always()` on each: a red suite still exits GameCI non-zero, and the grading of
      # WHY it was red is exactly what must not be skipped when that happens. The job stays
      # inside the license gate, so a fork without UNITY_LICENSE never reaches these steps.
      - name: Set up Node for grading
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the loombridge CLI
        if: always()
        working-directory: mcp-server
        run: |
          npm ci
          npm run build

      - name: Grade Unity test results
        if: always()
        run: |
          shopt -s nullglob
          files=(unity-test-results/${{ matrix.label }}/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No NUnit3 result XML was produced; a run that checked nothing is not a pass."
            exit 2
          fi
          status=0
          for f in "${files[@]}"; do
            echo "::group::loombridge tests grade $f"
            node mcp-server/dist/surfaces/cli.js tests grade --results "$f" || status=$?
            echo "::endgroup::"
          done
          exit $status

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results-${{ matrix.label }}
          path: unity-test-results/${{ matrix.label }}

  skipped:
    needs: detect-tests
    if: ${{ needs.detect-tests.outputs.has_tests != 'true' || needs.detect-tests.outputs.has_license != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why Unity tests were skipped
        run: |
          if [ "${{ needs.detect-tests.outputs.has_tests }}" != "true" ]; then
            echo "Skipped: no Unity test files found under packages/com.loomtide.loombridge/Tests/Editor."
          fi
          if [ "${{ needs.detect-tests.outputs.has_license }}" != "true" ]; then
            echo "Skipped: UNITY_LICENSE secret is not configured (forks and fresh clones skip gracefully)."
          fi
