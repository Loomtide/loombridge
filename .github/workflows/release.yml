# Loombridge release pipeline.
#
# On tag v*:
#   build + unit-test -> pack the bridge UPM tarball + `npm pack` the CLI ->
#   GitHub Release carrying both tarballs + install.sh -> npm publish, gated on
#   the NPM_TOKEN secret being configured (skip-with-notice when absent).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Tag must match the CLI package version
        working-directory: mcp-server
        run: |
          PKG_V="$(node -p "require('./package.json').version")"
          TAG_V="${GITHUB_REF_NAME#v}"
          if [ "$PKG_V" != "$TAG_V" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mcp-server/package.json version $PKG_V" >&2
            exit 1
          fi

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Unit tests
        working-directory: mcp-server
        run: npm run test:unit

      - name: Pack bridge UPM tarball
        run: bash scripts/loombridge-pack-bridge.sh --out-dir release-assets

      # `npm pack` runs prepack (build + bundle the bridge tarball + agent
      # surface), so the published CLI carries everything install-bridge and
      # install-agent need. The pack output's filename derives from the npm
      # scope, so it is copied to the stable installer-facing asset name.
      - name: Pack CLI tarball
        working-directory: mcp-server
        run: |
          rm -f ./*.tgz
          npm pack
          TAG_V="${GITHUB_REF_NAME#v}"
          PACKED="$(ls ./*.tgz | head -1)"
          cp "$PACKED" "../release-assets/loombridge-cli-${TAG_V}.tgz"
          ls -l ../release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh release-assets/install.sh
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*

      # npm publish via TRUSTED PUBLISHING (OIDC) — preferred: no token secret.
      # Configure once on npmjs.com: package `loombridge` -> Settings ->
      # Trusted publisher -> GitHub Actions (Loomtide/loombridge, release.yml).
      # NPM_TOKEN remains an optional fallback. Until one of the two is
      # configured, the step notices-and-continues: the GitHub Release assets
      # above are the primary install channel (install.sh).
      - name: npm publish (trusted publishing, token fallback)
        working-directory: mcp-server
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          npm install -g npm@11   # OIDC exchange needs npm >= 11.5
          echo "npm version: $(npm --version)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC env: PRESENT"; else echo "OIDC env: MISSING (id-token permission not effective)"; fi
          # A stale/empty _authToken npmrc line preempts the OIDC exchange — start clean.
          rm -f "$HOME/.npmrc"
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
          fi
          # Provenance attestation requires a PUBLIC repo; skip it while private.
          PROV="true"; [ "$REPO_PRIVATE" = "true" ] && PROV="false"
          if npm publish --access public --provenance="$PROV"; then
            echo "npm publish succeeded (provenance=$PROV)."
            exit 0
          fi
          # A release that did not reach npm must NOT report success. npm is now the primary
          # install channel (README: `npm install -g loombridge`), so a silently skipped
          # publish leaves every new user installing whatever `latest` already was, while the
          # pipeline shows green: a false green on the one path a user actually follows.
          # Set LOOMBRIDGE_ALLOW_PUBLISH_SKIP=1 as a repo variable to fall back to warn-only
          # while credentials are being configured.
          if [ "${{ vars.LOOMBRIDGE_ALLOW_PUBLISH_SKIP }}" = "1" ]; then
            echo "::warning::npm publish did not complete, and the skip escape hatch is enabled. The GitHub Release assets are the only channel carrying this version."
            exit 0
          fi
          echo "::error::npm publish FAILED. Configure trusted publishing for the 'loombridge' package (npmjs.com -> Settings -> Trusted publisher -> GitHub Actions, Loomtide/loombridge, release.yml) or set the NPM_TOKEN secret. The GitHub Release was created, but npm still serves the previous version, which is what 'npm install -g loombridge' resolves." >&2
          exit 1
